<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>로젠가르텐 · 오프라인 지도 샘플</title>
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin>
    <link rel="stylesheet" href="assets/sample-map/maplibre-gl.css">
    <link rel="stylesheet" href="sample-map.css">
  </head>
  <body>
    <main class="sample-shell">
      <div id="sampleMap" aria-label="로젠가르텐 입체 지형 지도"></div>

      <header class="sample-header">
        <a class="back-link" href="index.html" aria-label="기존 코스북으로 돌아가기">‹</a>
        <div>
          <p>2일차 · MAP SAMPLE</p>
          <h1>로젠가르텐 &amp; 카레짜</h1>
        </div>
        <span class="local-badge"><i></i> 로컬 지도</span>
      </header>

      <div class="map-mode" role="group" aria-label="지도 유형">
        <button class="active" type="button" data-mode="terrain" aria-pressed="true">입체 지형</button>
        <button type="button" data-mode="fast" aria-pressed="false">빠른 지도</button>
      </div>

      <div class="map-key" aria-label="경로 범례">
        <span><i class="trail"></i>트레킹</span>
        <span><i class="cable"></i>케이블카</span>
        <span><i class="car"></i>차량</span>
      </div>

      <section class="route-card" aria-live="polite">
        <span class="grabber" aria-hidden="true"></span>
        <div class="route-card-top">
          <span class="step-chip">핵심 구간 · 3→4</span>
          <span class="offline-note">HD 지형 · 약 37MB</span>
        </div>
        <h2>Kölner Hütte → Paolina</h2>
        <p>로젠가르텐 암벽 아래 능선을 따라 걷는 오늘의 핵심 트레킹 구간입니다.</p>
        <div class="route-meta">
          <span><strong>5.9km</strong> 트레킹</span>
          <span><strong>1,745m</strong> 최고 고도</span>
          <span><strong>오프라인</strong> 사용 가능</span>
        </div>
      </section>

      <div id="sampleStatus" class="sample-status">로컬 지도를 준비하는 중…</div>
    </main>

    <script src="assets/sample-map/maplibre-gl.js"></script>
    <script src="assets/sample-map/pmtiles.js"></script>
    <script src="assets/sample-map/basemaps.js"></script>
    <script src="sample-map.js"></script>
  </body>
</html>
